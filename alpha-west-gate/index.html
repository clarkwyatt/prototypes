<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Boy and the West Gate — Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap');
:root{--ink:#263d36;--cream:#fff9eb;--gold:#eebd63;--green:#3d9b68;--deep:#214d42;--line:#d9c79d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35;color:var(--ink);font-family:Nunito,system-ui,sans-serif;user-select:none}
body{display:grid;place-items:center;padding:14px}
#game{position:relative;width:min(1120px,calc(100vw - 28px));height:min(720px,calc(100vh - 28px));min-height:440px;border:5px solid #ead9ae;border-radius:22px;overflow:hidden;background:#9ecb87;box-shadow:0 22px 70px #081e197a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:12px 14px auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.quest,.inventory,.hint{border:2px solid #d6c28f;background:#fff9ebed;box-shadow:0 4px 14px #27423435;border-radius:16px;padding:8px 13px}
.brand{font-weight:900;color:#245244;font-size:17px;line-height:1.1}.brand small{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#71836a;margin-top:3px}
.quest{min-width:215px;max-width:290px;font-size:12px;font-weight:800;line-height:1.35}.quest strong{display:block;color:#28704f;font-size:13px;margin-bottom:2px}
.right{display:flex;gap:8px;align-items:flex-start}.inventory{font-size:12px;font-weight:800;min-width:122px;text-align:center}.inventory span{display:block;color:#83662d;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
.modal{position:absolute;inset:0;background:#102a27a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}
.card{width:min(600px,95%);max-height:90%;overflow:auto;border:4px solid #e4cb91;border-radius:24px;background:linear-gradient(#fff9eb,#f4e7c6);box-shadow:0 18px 55px #051a19a8;padding:24px;text-align:center}
.card h1{font-size:clamp(22px,4vw,34px);line-height:1.05;margin:0 0 8px;color:#285c4b}.card p{margin:8px auto;max-width:480px;line-height:1.5;font-weight:700;color:#52665a}.card .scene{height:160px;margin:14px 0;border:3px solid #d2bb83;border-radius:18px;background:linear-gradient(#c8e5ad 0 17%,#d8bd8c 17% 100%);display:grid;place-items:center;font-size:64px;box-shadow:inset 0 -10px #b18d5f33}
.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:13px;padding:11px 20px;background:var(--green);color:white;font:900 14px Nunito, sans-serif;box-shadow:0 4px 0 #26754d;cursor:pointer}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#e6d4a7;color:#485b4c;box-shadow:0 4px 0 #bca979}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#toast{position:absolute;left:50%;top:90px;transform:translate(-50%,-8px);background:#fff9eb;border:2px solid #d4bd83;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:900;box-shadow:0 5px 18px #10292345;opacity:0;transition:.2s;pointer-events:none;z-index:4;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
.touch{position:absolute;bottom:48px;left:16px;display:none;grid-template-columns:42px 42px 42px;grid-template-rows:40px 40px;gap:4px;opacity:.82}.touch button,.act{border:2px solid #fff0c5;background:#fff9ebd9;color:#245244;border-radius:12px;font-size:17px;font-weight:900;touch-action:none}.touch [data-dir=up]{grid-column:2}.touch [data-dir=left]{grid-column:1}.touch [data-dir=down]{grid-column:2}.touch [data-dir=right]{grid-column:3}.act{display:none;position:absolute;bottom:55px;right:18px;padding:13px 18px;background:#3d9b68;color:#fff;font-size:13px}
@media(max-width:700px){body{padding:0}#game{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0}.hud{inset:8px 8px auto;gap:5px}.brand{font-size:14px;padding:7px 9px}.brand small{font-size:8px}.quest{min-width:0;width:42vw;padding:7px 9px;font-size:10px}.quest strong{font-size:11px}.right{gap:5px;flex-direction:column;align-items:flex-end}.inventory{font-size:10px;min-width:98px;padding:6px 8px}.hint{bottom:8px;font-size:10px;max-width:94%;overflow:hidden}.touch,.act{display:grid}.act{display:block}.card{padding:18px}.card .scene{height:120px}}
</style>
</head>
<body>
<main id="game" aria-label="The Boy and the West Gate game prototype">
<canvas id="world" aria-label="Top down village adventure"></canvas>
<div class="hud"><div class="brand">THE WEST GATE<small>an adventure prototype</small></div><div class="quest" id="quest"><strong>First Steps</strong>Explore the village and find Grandfather.</div><div class="right"><div class="inventory"><span>Inventory</span><b id="items">Empty</b></div><div class="inventory"><span>Area</span><b id="area">13 · Village</b></div></div></div>
<div class="hint" id="hint">Move with WASD or arrow keys · Click a nearby object or press E</div>
<div class="touch" aria-label="Movement controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button class="act" id="act">INTERACT</button>
<div id="toast"></div>
<section class="modal" id="modal" role="dialog" aria-modal="true"><div class="card"><h1 id="modal-title"></h1><div class="scene" id="modal-scene"></div><div id="modal-copy"></div><div class="buttons" id="modal-buttons"></div></div></section>
</main>
<script>
(() => {
  const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),game=document.querySelector('#game');
  const questEl=document.querySelector('#quest'),itemsEl=document.querySelector('#items'),areaEl=document.querySelector('#area'),hintEl=document.querySelector('#hint');
  const modal=document.querySelector('#modal'),toastEl=document.querySelector('#toast');
  const W=1120,H=720, world={w:1120,h:720};
  let dpr=1,keys={},toastTimer=0,shake=0;
  const s={x:815,y:400,face:'left',speed:205,scene:'outside',interior:'',rodents:0,flowers:0,key:false,logGone:false,thorns:false,potion:false,strength:false,boulders:false,giantHits:0,giantDown:false,gateOpen:false};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function resize(){const r=game.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
  new ResizeObserver(resize).observe(game); resize();
  const locs=[['01',150,120],['02',500,120],['03',925,120],['06',150,265],['07',500,265],['08',925,265],['11',150,410],['12',500,410],['13',925,410],['16',150,555],['17',500,555],['18',925,555],['21',150,660],['22',500,660],['23',925,660]];
  function loc(){if(s.scene!=='outside')return '13 · Interior';if(s.y<205)return s.x<325?'01 · Shrine':s.x<720?'02 · Boulder Path':'03 · Giant Cave';if(s.y<350)return s.x<325?'11 · Thorn Path':s.x<720?'12 · River Path':'08 · Village Road';if(s.y<505)return s.x<325?'11 · Thorn Path':s.x<720?'12 · River Path':'13 · Village';return s.x<325?'21 · Alchemist Clearing':s.x<720?'17 · South Path':'18 · South Path'}
  function updateHud(){areaEl.textContent=loc();const i=[];if(s.key)i.push('🗝 West Gate Key');if(s.potion)i.push('🧪 Vine Potion');if(s.strength)i.push('✦ Super Strength');itemsEl.textContent=i.length?i.join(' · '):'Empty';
    if(s.scene!=='outside'){questEl.innerHTML='<strong>Basement Challenge</strong>Catch the runaway rodents: '+s.rodents+'/5';return}
    if(!s.key)questEl.innerHTML='<strong>First Quest</strong>Catch 5 rodents in Grandfather’s basement: '+s.rodents+'/5';
    else if(!s.logGone)questEl.innerHTML='<strong>West Gate</strong>Unlock the gate and cross the river on the log.';
    else if(!s.potion)questEl.innerHTML='<strong>Alchemist’s Request</strong>Find 3 bright flowers, then bring them to the hut: '+s.flowers+'/3';
    else if(!s.thorns)questEl.innerHTML='<strong>Clear the Way</strong>Use the potion on the thorny vines.';
    else if(!s.strength)questEl.innerHTML='<strong>The White Shrine</strong>Drink from the fountain to gain strength.';
    else if(!s.boulders)questEl.innerHTML='<strong>Open the Cave</strong>Push the boulders aside.';
    else if(!s.giantDown)questEl.innerHTML='<strong>Giant Cave</strong>Push falling boulders into the Giant: '+s.giantHits+'/3';
    else questEl.innerHTML='<strong>To Be Continued…</strong>Find the path back to the village.';
  }
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2100)}
  function button(label,fn,secondary=false){const b=document.createElement('button');b.className='btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;document.querySelector('#modal-buttons').appendChild(b);return b}
  function close(){modal.classList.remove('open');if(s.scene==='interior'){s.scene='outside';s.interior='';}updateHud()}
  function openModal(title,emoji,copy,actions){document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-scene').textContent=emoji;document.querySelector('#modal-copy').innerHTML=copy;const area=document.querySelector('#modal-buttons');area.replaceChildren();actions(area);modal.classList.add('open')}
  function simple(title,emoji,copy){openModal(title,emoji,'<p>'+copy+'</p>',()=>button('Got it!',close))}
  const objects=[
    {id:'home',name:'Your Home',x:985,y:365,r:55,icon:'home'},
    {id:'grandpa',name:'Grandfather’s House',x:835,y:450,r:60,icon:'grandpa'},
    {id:'gate',name:'West Gate',x:690,y:405,r:34,icon:'gate'},
    {id:'log',name:'River Log',x:480,y:360,r:42,icon:'log'},
    {id:'thorns',name:'Thorny Vines',x:245,y:360,r:48,icon:'thorns'},
    {id:'hut',name:'Alchemist’s Hut',x:135,y:605,r:58,icon:'hut'},
    {id:'flowers',name:'Bright Flowers',x:275,y:570,r:40,icon:'flowers'},
    {id:'boulders',name:'Boulder Blockage',x:560,y:205,r:52,icon:'boulders'},
    {id:'shrine',name:'White Shrine',x:145,y:145,r:58,icon:'shrine'},
    {id:'fountain',name:'Blue Fountain',x:145,y:220,r:36,icon:'fountain'},
    {id:'cave',name:'Giant’s Cave',x:960,y:135,r:62,icon:'cave'},
    {id:'village-return',name:'Village Path',x:885,y:545,r:30,icon:'return'}
  ];
  function available(o){switch(o.id){case'home':case'grandpa':case'shrine':case'fountain':case'hut':case'flowers':case'cave':case'village-return':return true;case'gate':return !s.logGone;case'log':return s.gateOpen&&!s.logGone;case'thorns':return !s.thorns;case'boulders':return !s.boulders;}return false}
  function nearest(){if(s.scene!=='outside')return null;return objects.filter(available).map(o=>({...o,dist:Math.hypot(o.x-s.x,o.y-s.y)})).filter(o=>o.dist<o.r+26).sort((a,b)=>a.dist-b.dist)[0]||null}
  function interact(o=nearest()){if(!o){toast('Move closer to an object first.');return}switch(o.id){
    case'home':openInterior('Your Home','🏠','A little house in the village. This is where the adventure begins.',()=>button('Step outside',close));break;
    case'grandpa':openInterior('Grandfather’s House','🪵','Grandfather asks for help in the basement. Catch all 5 runaway rodents and he’ll give you the West Gate key.',()=>{button('Go to the basement',()=>{s.scene='interior';s.interior='basement';updateHud();showBasement()});button('Not now',close,true)});break;
    case'gate':if(!s.key){simple('The West Gate is locked','🚪','It needs a key. Grandfather may know where one is.')}else{ s.key=false;s.gateOpen=true;toast('The West Gate opens! Cross the river on the log.');updateHud();}break;
    case'log':if(!s.gateOpen){simple('The river crossing','🌊','The gate must be open before you can reach the log.')}else{ s.logGone=true;s.x=360;s.y=405;toast('You crossed safely. The log drifted away.');updateHud();}break;
    case'thorns':if(!s.potion){simple('Thorny Vines','🌿','These vines block the path. You’ll need help from the alchemist.')}else{s.thorns=true;s.potion=false;toast('The potion clears the vines. The sky grows dim…');updateHud()}break;
    case'hut':openInterior('The Alchemist’s Hut','⚗️',s.flowers>=3?'The alchemist uses the flowers to brew a potion for the thorns.':'The retired alchemist can brew a potion. He needs 3 bright flowers first.',()=>{if(s.flowers>=3&&!s.potion&&!s.thorns){button('Give the flowers',()=>{s.flowers=0;s.potion=true;close();toast('You received a Vine Potion.');updateHud()})}button('Leave the hut',close,true)});break;
    case'flowers':if(s.flowers<3){s.flowers++;toast('Bright flower collected: '+s.flowers+'/3');updateHud();if(s.flowers>=3)simple('That’s all 3 flowers!','🌼','Bring them to the alchemist’s hut.')}else simple('A patch of flowers','🌼','You have all the flowers the alchemist needs.');break;
    case'boulders':if(!s.strength){simple('Heavy Boulders','🪨','They won’t budge. Maybe the shrine can make you stronger.')}else{s.boulders=true;toast('Super strength! You push the boulders aside.');updateHud()}break;
    case'shrine':simple('A Quiet Clearing','⛩️','A white shrine stands in the trees. A small blue fountain bubbles nearby.');break;
    case'fountain':if(!s.strength){openModal('The Shrine Fountain','💧','<p>The blue liquid sparkles in the light. Do you drink it?</p>',()=>{button('Drink',()=>{s.strength=true;close();toast('You feel much stronger!');updateHud()});button('Not yet',close,true)})}else simple('The Shrine Fountain','💧','You feel strong enough to push the boulders.');break;
    case'cave':if(!s.boulders){simple('Giant’s Cave','🕳️','The boulders block the cave entrance.')}else openCave();break;
    case'village-return':if(s.giantDown){s.x=825;s.y=450;simple('Back in the Village','🏘️','The way home is open. But the thorny vines have spread through the village… To Be Continued!')}else simple('Village Path','🌳','The cave is still ahead.');break;
  }}
  function openInterior(title,emoji,copy,actions){s.scene='interior';s.interior='room';openModal(title,emoji,'<p>'+copy+'</p>',actions)}
  function showBasement(){openModal('Grandfather’s Basement','🐭','<p>Catch the little rodents! Click them or press the green button when they’re highlighted. <b>'+s.rodents+'/5 caught.</b></p><div id="mice" style="font-size:32px;letter-spacing:14px;margin:18px">'+Array.from({length:5},(_,i)=>i<s.rodents?'✨':'🐭').join('')+'</div>',()=>{if(s.rodents<5)button('Catch a Rodent',()=>{s.rodents++;if(s.rodents>=5){s.key=true;openModal('West Gate Key!','🗝️','<p>Grandfather gives you the key. Head to the West Gate between the village and the river path.</p>',()=>button('Return to the village',close));updateHud()}else showBasement();});else button('Return to the village',close);button('Leave',close,true)});}
  function openCave(){s.scene='interior';s.interior='cave';s.giantHits=0;openModal('The Giant’s Cave','👹','<p>The Giant is furious! When shadows blink, push a fallen boulder toward him. Hit him 3 times.</p><div id="boss" style="font-size:64px;margin:10px">👹</div><div id="boss-count" style="font-weight:900;color:#286448">Hits: 0 / 3</div>',()=>{button('Wait for a boulder',()=>{const boss=document.querySelector('#boss');boss.textContent='👹  🪨';setTimeout(()=>{if(!modal.classList.contains('open'))return;s.giantHits++;document.querySelector('#boss-count').textContent='Hits: '+s.giantHits+' / 3';if(s.giantHits>=3){s.giantDown=true;openModal('The Giant Is Down!','💫','<p>The cave exit opens to the right. Follow the path back toward the village.</p>',()=>button('Leave the cave',()=>{close();s.x=1040;s.y=250;updateHud()}));}else{boss.textContent='👹';toast('The boulder hits! '+s.giantHits+'/3');}} ,850)});button('Leave cave',()=>{close();s.x=1040;s.y=250;updateHud()},true)});}
  const treeSpots=[[20,40],[350,55],[760,25],[1090,80],[20,250],[1100,310],[15,535],[390,670],[735,680],[1100,640],[340,185],[720,520],[1000,580],[65,475],[1035,220],[380,290],[640,40]];
  function roundedRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function tree(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#77583d';ctx.fillRect(-5,8,10,24);for(let i=0;i<3;i++){ctx.fillStyle=['#4e8757','#5d9a5f','#72aa66'][i];ctx.beginPath();ctx.arc(0,-6-i*9,22-i*3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#9ecb78';ctx.beginPath();ctx.arc(-9,-23,5,0,7);ctx.fill();ctx.restore()}
  function flower(x,y,c='#f1d469'){ctx.fillStyle='#f6e5a1';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+Math.cos(i*1.256)*5,y+Math.sin(i*1.256)*5,3,4,i*1.256,0,7);ctx.fill()}ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
  function path(){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#8eaa69';ctx.lineWidth=104;ctx.beginPath();ctx.moveTo(870,415);ctx.bezierCurveTo(760,410,710,440,620,420);ctx.bezierCurveTo(515,400,450,405,350,410);ctx.bezierCurveTo(300,420,310,490,260,520);ctx.bezierCurveTo(215,548,140,560,135,620);ctx.bezierCurveTo(120,505,105,430,150,365);ctx.bezierCurveTo(220,300,345,315,400,230);ctx.bezierCurveTo(445,170,350,150,160,170);ctx.bezierCurveTo(325,110,490,160,560,205);ctx.bezierCurveTo(690,210,825,130,950,140);ctx.bezierCurveTo(985,235,1040,300,970,405);ctx.bezierCurveTo(930,470,930,500,905,550);ctx.stroke();ctx.strokeStyle='#dfc48d';ctx.lineWidth=86;ctx.stroke();ctx.strokeStyle='#eed9a5';ctx.lineWidth=70;ctx.stroke();ctx.restore()}
  function drawHouse(x,y,color,label,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#6b503b';ctx.fillRect(-43,-7,86,56);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-52,-5);ctx.lineTo(0,-47);ctx.lineTo(52,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#f2d69d';ctx.fillRect(-9,15,18,34);ctx.fillStyle='#9ad3db';ctx.fillRect(-33,8,15,14);ctx.fillRect(18,8,15,14);ctx.fillStyle='#395f48';ctx.font='800 13px Nunito';ctx.textAlign='center';ctx.fillText(label,0,69);ctx.restore()}
  function drawObject(o){const pulse=1+Math.sin(Date.now()/240)*.035;ctx.save();ctx.translate(o.x,o.y);if(nearest()?.id===o.id){ctx.strokeStyle='#fff7cb';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,10,o.r*pulse,o.r*.55*pulse,0,0,Math.PI*2);ctx.stroke();}
    switch(o.id){case'home':drawHouse(0,0,'#b76352','Home',.74);break;case'grandpa':drawHouse(0,0,'#8c6947','Grandpa',.70);break;
      case'gate':ctx.fillStyle='#775332';ctx.fillRect(-27,-40,10,80);ctx.fillRect(17,-40,10,80);ctx.fillStyle='#ad8154';ctx.fillRect(-17,-34,34,68);ctx.fillStyle='#f0d596';ctx.font='900 20px Nunito';ctx.textAlign='center';ctx.fillText(s.gateOpen?'OPEN':'🔒',0,9);ctx.fillStyle='#435544';ctx.font='800 12px Nunito';ctx.fillText('WEST GATE',0,60);break;
      case'log':if(!s.logGone){ctx.rotate(-.08);roundedRect(-48,-11,96,22,10,'#8b5f38');for(let i=-35;i<45;i+=15){ctx.fillStyle='#c0915b';ctx.beginPath();ctx.arc(i,-1,2,0,7);ctx.fill()}ctx.fillStyle='#335a70';ctx.font='800 11px Nunito';ctx.textAlign='center';ctx.fillText('CROSS',0,34)}break;
      case'thorns':if(!s.thorns){for(let i=0;i<8;i++){ctx.strokeStyle=i%2?'#465e39':'#607343';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-38+i*10,18);ctx.bezierCurveTo(-20+i*8,-20,5+i*4,35,35-i*8,-22);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='900 12px Nunito';ctx.textAlign='center';ctx.fillText('THORNY VINES',0,48)}break;
      case'hut':drawHouse(0,0,'#a98259','Alchemist',.78);ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('⚗️',0,-25);break;
      case'flowers':for(let i=0;i<9;i++)flower(-25+(i%3)*24,-12+Math.floor(i/3)*20,['#f8d568','#dc91a1','#f5efe0'][i%3]);ctx.fillStyle='#365744';ctx.font='800 12px Nunito';ctx.textAlign='center';ctx.fillText('BRIGHT FLOWERS',0,42);break;
      case'boulders':if(!s.boulders){for(let i=0;i<4;i++){ctx.fillStyle=['#8a8b78','#777d70','#9d9b83','#747b70'][i];ctx.beginPath();ctx.ellipse(-34+i*22,Math.sin(i)*10,21,19,0,0,7);ctx.fill();ctx.strokeStyle='#bbc0a5';ctx.lineWidth=2;ctx.stroke()}ctx.fillStyle='#3d5144';ctx.font='900 12px Nunito';ctx.textAlign='center';ctx.fillText('BOULDERS',0,44)}break;
      case'shrine':ctx.fillStyle='#fff9e9';ctx.strokeStyle='#c4b99e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-34,-18);ctx.lineTo(0,-47);ctx.lineTo(34,-18);ctx.lineTo(28,28);ctx.lineTo(-28,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#9fd5db';ctx.fillRect(-7,0,14,28);ctx.fillStyle='#395b47';ctx.font='800 12px Nunito';ctx.textAlign='center';ctx.fillText('WHITE SHRINE',0,47);break;
      case'fountain':ctx.fillStyle='#b8dbe1';ctx.beginPath();ctx.ellipse(0,0,34,18,0,0,7);ctx.fill();ctx.strokeStyle='#f5f2de';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#71b8c4';ctx.beginPath();ctx.ellipse(0,-3,20,9,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 11px Nunito';ctx.textAlign='center';ctx.fillText('DRINK',0,34);break;
      case'cave':ctx.fillStyle='#574d46';ctx.beginPath();ctx.ellipse(0,0,60,43,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='#233c36';ctx.beginPath();ctx.ellipse(0,8,42,31,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff4d5';ctx.font='800 13px Nunito';ctx.textAlign='center';ctx.fillText('GIANT’S CAVE',0,58);if(!s.boulders){for(let i=0;i<3;i++){ctx.fillStyle='#8a8b78';ctx.beginPath();ctx.arc(-20+i*20,0,14,0,7);ctx.fill()}}break;
      case'village-return':ctx.fillStyle='#456f49';ctx.beginPath();ctx.arc(0,0,28,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 11px Nunito';ctx.textAlign='center';ctx.fillText('VILLAGE',0,44);break;}
    ctx.restore()}
  function drawBoy(){ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#21362d48';ctx.beginPath();ctx.ellipse(0,14,17,8,0,0,7);ctx.fill();ctx.fillStyle='#5b4a3b';ctx.beginPath();ctx.arc(0,-7,12,0,7);ctx.fill();ctx.fillStyle='#e3b77f';ctx.beginPath();ctx.arc(0,-6,8,0,7);ctx.fill();ctx.fillStyle='#416d52';ctx.beginPath();ctx.ellipse(0,9,13,15,0,0,7);ctx.fill();ctx.fillStyle='#d0a551';ctx.fillRect(-9,20,7,5);ctx.fillRect(2,20,7,5);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.face==='left'?-3:3,-8,1.7,0,7);ctx.fill();ctx.restore()}
  function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b8d89a');sky.addColorStop(1,'#84b778');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // Soft, painterly meadow patches.
    for(let i=0;i<32;i++){const x=(i*197+53)%W,y=(i*113+31)%H;ctx.fillStyle=i%2?'#a7ce85':'#9fc67e';ctx.globalAlpha=.23;ctx.beginPath();ctx.ellipse(x,y,75,26,(i%5)*.35,0,7);ctx.fill()}ctx.globalAlpha=1;
    path();
    // River and the one-use log crossing between cells 11 and 12.
    ctx.fillStyle='#6eafc0';ctx.beginPath();ctx.moveTo(350,330);ctx.bezierCurveTo(435,345,530,330,600,346);ctx.lineTo(600,390);ctx.bezierCurveTo(500,376,430,392,350,378);ctx.closePath();ctx.fill();ctx.strokeStyle='#d3eef0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(370,345);ctx.bezierCurveTo(440,359,520,346,585,359);ctx.stroke();
    if(!s.logGone){ctx.fillStyle='#8d6138';ctx.beginPath();ctx.roundRect(434,347,90,22,10);ctx.fill();ctx.strokeStyle='#c09561';ctx.lineWidth=3;for(let x=448;x<512;x+=18){ctx.beginPath();ctx.moveTo(x,350);ctx.lineTo(x-2,365);ctx.stroke()}}
    // Subtle panel seams retain the paper map's reference locations without becoming a grid UI.
    ctx.strokeStyle='#fff9d033';ctx.lineWidth=1;for(let x=0;x<=1120;x+=224){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=144;y+=144){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    // Landmark clearings and forest edges.
    ctx.fillStyle='#c9df9a';ctx.beginPath();ctx.ellipse(155,166,100,73,-.1,0,7);ctx.fill();ctx.fillStyle='#e8ead7';ctx.beginPath();ctx.ellipse(155,165,70,47,0,0,7);ctx.fill();
    ctx.fillStyle='#c5d994';ctx.beginPath();ctx.ellipse(150,606,108,76,.1,0,7);ctx.fill();
    ctx.fillStyle='#d5e4a4';ctx.beginPath();ctx.ellipse(930,128,120,80,0,0,7);ctx.fill();
    treeSpots.forEach((t,i)=>tree(t[0],t[1],.9+(i%3)*.13));
    // Scattered scenery, flowers and grasses.
    for(let i=0;i<45;i++){const x=(i*83+37)%W,y=(i*139+58)%H;if((x>365&&x<610&&y>325&&y<390))continue;flower(x,y,i%4===0?'#fff1d0':i%4===1?'#f4c76a':i%4===2?'#d88c9a':'#f5e6ac')}
    // Cell references in the playable 3-column slice.
    locs.forEach(([label,x,y])=>{ctx.fillStyle='#274a3c8c';ctx.font='800 11px Nunito';ctx.textAlign='left';ctx.fillText(label,x-105,y-53)});
    // Interior/exterior building and landmarks.
    objects.forEach(drawObject);
    if(s.scene==='outside')drawBoy();
    if(s.scene==='interior'){ctx.fillStyle='#18372f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c7ae7b';ctx.fillRect(0,390,W,330);ctx.fillStyle='#e5d1a2';ctx.fillRect(0,0,W,392);for(let x=0;x<W;x+=140){ctx.strokeStyle='#c6af83';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,392);ctx.stroke()}ctx.fillStyle='#6e553e';ctx.fillRect(0,395,W,12);ctx.fillStyle='#523d2e';ctx.fillRect(50,500,100,130);ctx.fillStyle='#987349';ctx.fillRect(62,512,76,106);ctx.fillStyle='#fff6d9';ctx.font='900 20px Nunito';ctx.textAlign='center';ctx.fillText(s.interior==='basement'?'BASEMENT':'ROOM',560,445);}
    updateHud();requestAnimationFrame(draw)}
  function move(dt){if(s.scene!=='outside'||modal.classList.contains('open'))return;let dx=0,dy=0;if(keys.ArrowLeft||keys.a||keys.A)dx--;if(keys.ArrowRight||keys.d||keys.D)dx++;if(keys.ArrowUp||keys.w||keys.W)dy--;if(keys.ArrowDown||keys.s||keys.S)dy++;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;if(dx)s.face=dx<0?'left':'right';const nx=clamp(s.x+dx*s.speed*dt,42,W-42),ny=clamp(s.y+dy*s.speed*dt,88,H-40);
    // A few gentle blockers make the puzzle objects matter without making movement fiddly.
    if(!s.thorns&&nx<285&&ny>325&&ny<395){toastOnce('vines','The thorny vines block the way.');return}
    if(!s.boulders&&nx>515&&nx<615&&ny<240){toastOnce('rocks','The boulders are too heavy.');return}
    if(!s.gateOpen&&nx<740&&nx>650&&ny>370&&ny<445){toastOnce('gate','The West Gate is locked.');return}
    if(!s.logGone&&nx<600&&nx>350&&ny>330&&ny<392&&((dx<0&&s.x>=600)||(dx>0&&s.x<=350))){toastOnce('river','The river is too wide to cross without the log.');return}
    s.x=nx;s.y=ny;
    // The log disappears when the player makes it across the river.
    if(s.gateOpen&&!s.logGone&&s.x<350&&s.y>330&&s.y<392){s.logGone=true;toast('You crossed the river. The log drifts away.');updateHud()}
    if(s.giantDown&&s.x>1030&&s.y>300){s.x=920;s.y=520;simple('The Village','🏘️','You made it back. Thorny vines now cover the village… To Be Continued!')}
  }
  let toastOnceMap={};function toastOnce(k,msg){if(Date.now()>(toastOnceMap[k]||0)){toast(msg);toastOnceMap[k]=Date.now()+1600}}
  let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;move(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);draw();
  window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if((e.key==='e'||e.key==='E'||e.key==='Enter')&&!modal.classList.contains('open'))interact();if(e.key==='Escape'&&modal.classList.contains('open'))close()});window.addEventListener('keyup',e=>keys[e.key]=false);
  canvas.addEventListener('pointerdown',e=>{if(modal.classList.contains('open'))return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const obj=objects.filter(available).map(o=>({...o,dist:Math.hypot(x-o.x,y-o.y)})).filter(o=>o.dist<o.r+12).sort((a,b)=>a.dist-b.dist)[0];if(obj){if(Math.hypot(s.x-obj.x,s.y-obj.y)<obj.r+38)interact(obj);else toast('Walk closer, then click the object.')}else if(x<150&&y>550){keys.ArrowDown=true;setTimeout(()=>keys.ArrowDown=false,500)}});
  document.querySelectorAll('.touch button').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[dir]]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[dir]]=false))});document.querySelector('#act').onclick=()=>interact();
  updateHud();
})();
</script>
