<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Boy and the West Gate — Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap');
:root{--ink:#263d36;--cream:#fff9eb;--gold:#eebd63;--green:#3d9b68;--deep:#214d42;--line:#d9c79d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35;color:var(--ink);font-family:Nunito,system-ui,sans-serif;user-select:none}
body{display:grid;place-items:center;padding:14px}
#game{position:relative;width:min(1120px,calc(100vw - 28px));height:min(720px,calc(100vh - 28px));min-height:440px;border:5px solid #ead9ae;border-radius:22px;overflow:hidden;background:#9ecb87;box-shadow:0 22px 70px #081e197a}
canvas{position:absolute;left:-6%;top:-6%;display:block;width:112%;height:112%;touch-action:none}
.hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}
.quest,.inventory,.compass,.hint{border:2px solid #d6c28f;background:#fff9ebed;box-shadow:0 4px 14px #27423435;border-radius:16px;padding:8px 13px}
.quest{min-width:215px;max-width:290px;font-size:12px;font-weight:800;line-height:1.35}.quest strong{display:block;color:#28704f;font-size:13px;margin-bottom:2px}
.inventory{grid-column:2;grid-row:1;justify-self:center;font-size:12px;font-weight:800;min-width:160px;text-align:center}.inventory span{display:block;color:#83662d;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.compass{grid-column:3;grid-row:1;justify-self:end;position:relative;width:70px;height:70px;padding:0;border-radius:50%;font-size:10px;font-weight:900;color:#47634f;text-align:center}
.compass b{position:absolute}.compass .n{top:4px;left:50%;transform:translateX(-50%);color:#28704f}.compass .e{right:6px;top:50%;transform:translateY(-50%)}.compass .s{bottom:4px;left:50%;transform:translateX(-50%)}.compass .w{left:6px;top:50%;transform:translateY(-50%)}
.compass i{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#3d9b68 0 50%,#d5c28f 50%)}
.quest.empty{visibility:hidden}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}
.modal{position:absolute;inset:0;background:#102a27a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}
.card{width:min(600px,95%);max-height:90%;overflow:auto;border:4px solid #e4cb91;border-radius:24px;background:linear-gradient(#fff9eb,#f4e7c6);box-shadow:0 18px 55px #051a19a8;padding:24px;text-align:center}
.card h1{font-size:clamp(22px,4vw,34px);line-height:1.05;margin:0 0 8px;color:#285c4b}.card p{margin:8px auto;max-width:480px;line-height:1.5;font-weight:700;color:#52665a}.card .scene{height:160px;margin:14px 0;border:3px solid #d2bb83;border-radius:18px;background:linear-gradient(#c8e5ad 0 17%,#d8bd8c 17% 100%);display:grid;place-items:center;font-size:64px;box-shadow:inset 0 -10px #b18d5f33}
.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:13px;padding:11px 20px;background:var(--green);color:white;font:900 14px Nunito, sans-serif;box-shadow:0 4px 0 #26754d;cursor:pointer}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#e6d4a7;color:#485b4c;box-shadow:0 4px 0 #bca979}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#toast{position:absolute;left:50%;top:90px;transform:translate(-50%,-8px);background:#fff9eb;border:2px solid #d4bd83;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:900;box-shadow:0 5px 18px #10292345;opacity:0;transition:.2s;pointer-events:none;z-index:4;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
.touch{position:absolute;bottom:48px;left:16px;display:none;grid-template-columns:42px 42px 42px;grid-template-rows:40px 40px;gap:4px;opacity:.82}.touch button{border:2px solid #fff0c5;background:#fff9ebd9;color:#245244;border-radius:12px;font-size:17px;font-weight:900;touch-action:none}.touch [data-dir=up]{grid-column:2}.touch [data-dir=left]{grid-column:1}.touch [data-dir=down]{grid-column:2}.touch [data-dir=right]{grid-column:3}
@media(max-width:700px){body{padding:0}#game{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0}.hud{inset:8px 8px auto;grid-template-columns:1fr auto 1fr;gap:5px}.quest{min-width:0;width:min(42vw,230px);padding:7px 9px;font-size:10px}.quest strong{font-size:11px}.inventory{font-size:10px;min-width:94px;padding:6px 8px}.compass{width:54px;height:54px;font-size:8px}.compass .n{top:2px}.compass .e{right:4px}.compass .s{bottom:2px}.compass .w{left:4px}.compass i{width:15px;height:15px}.hint{bottom:8px;font-size:10px;max-width:94%;overflow:hidden;white-space:normal;text-align:center}.touch{display:grid}.card{padding:18px}.card .scene{height:120px}}
</style>
</head>
<body>
<main id="game" aria-label="The Boy and the West Gate game prototype">
<canvas id="world" aria-label="Top down village adventure"></canvas>
<div class="hud"><div class="quest" id="quest"><strong>First Steps</strong>Explore the village.</div><div class="inventory"><span>Inventory</span><b id="items">Empty</b></div><div class="compass" role="img" aria-label="Compass, north is up"><b class="n">N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b><i></i></div></div>
<div class="hint" id="hint">Move with WASD or arrow keys · Left-click nearby objects to interact</div>
<div class="touch" aria-label="Movement controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<div id="toast"></div>
<section class="modal" id="modal" role="dialog" aria-modal="true"><div class="card"><h1 id="modal-title"></h1><div class="scene" id="modal-scene"></div><div id="modal-copy"></div><div class="buttons" id="modal-buttons"></div></div></section>
</main>
<script src="game.js?v=routes-7"></script>
</body>
</html>
