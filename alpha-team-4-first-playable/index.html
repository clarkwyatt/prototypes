<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Alpha OC Team 4 — First Playable</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35;color:#263d36;font-family:Nunito,system-ui,sans-serif;user-select:none}
#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#b4d6a3}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;pointer-events:none;align-items:start;z-index:9}
.quest,.inventory,.equipment,.compass,.controls{border:2px solid #e7d7ad;background:linear-gradient(145deg,#fffdf4f5,#f8efd9ed);box-shadow:0 5px 0 #28473724,0 10px 24px #1a352d35;border-radius:16px;color:#31483c;font-weight:800}
.quest{width:min(100%,290px);padding:9px 13px;font-size:12px}.quest strong,.controls strong{display:block;color:#28704f;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.center-hud{grid-column:2;justify-self:center;display:flex;align-items:flex-start;gap:8px}.right-hud{position:absolute;top:12px;right:14px;z-index:9;display:flex;flex-direction:column;align-items:center;gap:9px;grid-column:auto;justify-self:auto}.center-hud .equipment{display:none}.inventory{text-align:center;width:clamp(88px,31vw,200px);padding:8px 13px;font-size:12px;overflow-wrap:anywhere}.equipment{width:70px;padding:5px;text-align:center}.paper-doll{display:block;width:48px;height:71px;margin:0 auto}.paper-doll .armor-slot{fill:#727b76;stroke:#45534a;stroke-width:1.5;transition:fill .15s}.paper-doll .armor-slot.equipped{fill:#3aaf69;stroke:#246b43}.inventory span{display:block;color:#385645;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.compass{width:70px;height:70px;border-radius:50%;position:relative;font-size:10px}.compass b{position:absolute}.n{top:4px;left:50%;transform:translateX(-50%);color:#28704f}.s{bottom:4px;left:50%;transform:translateX(-50%)}.e{right:6px;top:50%;transform:translateY(-50%)}.w{left:6px;top:50%;transform:translateY(-50%)}.compass i{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#3d9b68 50%,#d5c28f 50%)}
.controls{position:absolute;bottom:14px;left:14px;padding:8px 12px;font-size:11px;pointer-events:none;z-index:9}
.popup-layer{position:absolute;inset:0;z-index:10}
.popup{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(310px,92%);max-height:48%;overflow:auto;padding:17px 18px;border:3px solid #e4cb91;border-radius:18px;background:radial-gradient(ellipse at 50% 0,#fffef7,#fff9eb 50%,#f1e2bf);box-shadow:0 10px 32px #051a1966}
.popup-layer:has(.quest-celebration){background:radial-gradient(circle at center,#142b2470,#071711b8)}
.popup.quest-celebration{position:absolute;top:50%;bottom:auto;left:50%;transform:translate(-50%,-50%);width:min(520px,90vw);max-height:min(80vh,620px);padding:48px 38px 38px;text-align:center;overflow:visible;border:5px solid #f3d57c;border-radius:28px;background:radial-gradient(ellipse at 50% 0%,#fffbea 0%,#f8e7b6 62%,#eacb83 100%);box-shadow:0 0 0 7px #775522,0 0 0 11px #fff1bd77,0 22px 65px #07150ed9, inset 0 0 0 3px #fff6d5}
.popup.quest-celebration:before{content:'✦';display:block;margin:-20px auto 10px;color:#b88924;font-size:54px;line-height:1;text-shadow:0 2px #fff8dc}
.popup.quest-celebration h2{margin:0 0 16px;color:#276546;font-size:clamp(28px,4vw,39px);font-weight:1000;line-height:1.08;text-shadow:0 2px #fff8df}
.popup.quest-celebration #popup-copy{font-size:clamp(17px,2.5vw,23px);font-weight:900;color:#5b4b29;line-height:1.35}
.popup.quest-celebration .actions{display:flex;justify-content:center;margin-top:27px}
.popup.quest-celebration .actions button{min-width:145px;padding:13px 26px;font-size:18px;border:2px solid #1e6240;border-radius:15px;box-shadow:0 5px 0 #184d33}
.popup.quest-celebration .close{display:none}
@media(max-width:700px){.popup.quest-celebration{width:min(420px,88vw);padding:36px 22px 29px;border-width:4px}.popup.quest-celebration:before{font-size:43px;margin:-10px auto 8px}}
.popup h2{font-size:19px;color:#285c4b;margin:0 28px 6px 0}#popup-copy{font-size:13px;font-weight:700;line-height:1.4}.close{position:absolute;right:9px;top:8px;border:0;border-radius:50%;width:28px;height:28px;background:#e6d4a7;color:#485b4c;font-size:18px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:8px 13px;font-weight:900;background:linear-gradient(#f0dfb7,#e6d4a7);color:#485b4c;cursor:pointer}.actions button.primary{background:linear-gradient(#3c8056,#28664a);color:white}.popup button:focus-visible{outline:2px solid #28704f;outline-offset:2px}.actions:empty{display:none}
@media(max-width:700px){.hud{inset:8px 8px auto;gap:5px}.quest{padding:7px 9px;font-size:10px}.inventory{padding:6px 8px;font-size:10px}.center-hud{gap:4px}.right-hud{top:8px;right:8px;gap:5px}.equipment{width:54px;padding:3px}.paper-doll{width:36px;height:54px}.compass{width:54px;height:54px;font-size:8px}.compass i{width:15px;height:15px}.controls{left:8px;bottom:8px;padding:6px 8px;font-size:9px}}

#treehouse-scene{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#0b211bc9}
#treehouse-scene[hidden]{display:none}
.treehouse-room{position:relative;width:min(760px,88vw);height:min(540px,78vh);overflow:hidden;border:12px solid #755037;border-radius:26px;background:#9d794f;box-shadow:0 0 0 5px #d7b37c,0 30px 80px #08130bd9,inset 0 0 45px #553b2580}
 .treehouse-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}.treehouse-room:before{display:none;content:"";position:absolute;inset:22% 5% 12%;background:repeating-linear-gradient(0deg,#cfa879 0 48px,#ad8358 49px 53px);border:8px solid #8b603d;border-radius:12px;box-shadow:inset 0 0 38px #6c482b55}
.room-window,.room-bed,.room-table,.room-rug{display:none}.room-window{position:absolute;top:10%;left:43%;width:112px;height:92px;background:linear-gradient(#a8d5e6 60%,#8dbd81 61%);border:11px solid #775038;border-radius:14px;box-shadow:inset 0 0 0 3px #d9bc89}
.room-window:after{content:"";position:absolute;left:42%;top:0;bottom:0;border-left:7px solid #775038}
.room-bed{position:absolute;left:10%;top:33%;width:29%;height:37%;background:#8b5c3d;border:9px solid #67452d;border-radius:24px;box-shadow:0 12px 0 #533924}
.room-bed:before{content:"";position:absolute;inset:9% 9% 7%;background:#5c9c83;border-radius:12px;border-bottom:18px solid #3c7969}
.room-bed:after{content:"";position:absolute;top:9%;left:16%;width:68%;height:24%;border-radius:12px;background:#f2e4bd}
.room-table{position:absolute;right:11%;top:37%;width:22%;height:22%;background:#aa7646;border:9px solid #754e2e;border-radius:50%;box-shadow:0 14px 0 #6a482d}
.room-rug{position:absolute;left:39%;top:46%;width:26%;height:29%;background:#d5b06f;border:8px solid #a35f3c;border-radius:50%;box-shadow:inset 0 0 0 8px #ead19a}
.room-boy{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:34px;height:53px;background:#5b9a68;border-radius:13px 13px 7px 7px;box-shadow:-8px 27px 0 -5px #34495d,8px 27px 0 -5px #34495d}
.room-boy:before{content:"";position:absolute;left:5px;top:-21px;width:24px;height:26px;border-radius:50%;background:linear-gradient(#49372e 0 27%,#efbd91 28%)}
.room-door{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);width:128px;height:88px;background:linear-gradient(90deg,#70482d,#98663c);border:9px solid #513823;border-radius:50% 50% 5px 5px;cursor:pointer;color:#fff4d5;font-size:13px;font-weight:900;box-shadow:inset -13px 0 #5a3c2a}
.room-door{background:transparent;border:0;box-shadow:none;color:transparent}.room-door:hover,.room-door:focus-visible{outline:4px solid #70df89;outline-offset:2px}
@media(max-width:700px){.treehouse-room{width:94vw;height:min(530px,75vh);border-width:7px}.room-window{width:75px;height:70px}.room-door{width:104px;height:76px}}
.room-hero{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:70px;height:91px;pointer-events:none;z-index:2}.room-door{z-index:3}
#debug-nav{position:absolute;right:12px;bottom:12px;z-index:12;font:700 12px system-ui,sans-serif;color:#385342}
#debug-toggle{padding:9px 14px;border:2px solid #d9c69c;border-radius:12px;background:#fff9e9ee;color:#385342;font:inherit;cursor:pointer;box-shadow:0 3px 12px #20392b45}
#debug-menu{position:absolute;right:0;bottom:calc(100% + 8px);width:185px;padding:12px;background:#fff9e9;border:2px solid #d9c69c;border-radius:12px;box-shadow:0 4px 16px #20392b65}
#debug-menu[hidden]{display:none}
#debug-menu label{display:block;margin-bottom:5px}
#debug-menu select{width:100%;font:inherit;padding:6px;border:1px solid #b8b09a;border-radius:7px;background:white;color:#243c2e}
#debug-go{margin-top:8px;width:100%;font:inherit;padding:7px;border:0;border-radius:7px;background:#358b5d;color:white;cursor:pointer}
#build-commit{margin-top:10px;padding-top:9px;border-top:1px solid #d9c69c;font:600 11px system-ui,sans-serif;color:#385342;overflow-wrap:anywhere}
</style></head><body><main id="game">
<canvas id="world" tabindex="-1" aria-label="Team 4 top-down game"></canvas>
<div class="hud"><div class="quest"><strong>Quest</strong><span id="quest-text" aria-live="polite"></span></div><div class="center-hud"><div class="inventory"><span>Inventory</span><b id="items" aria-live="polite">Empty</b></div></div></div><div class="right-hud"><div class="compass" role="img" aria-label="Compass"><b class="n">N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b><i></i></div><div class="equipment"><svg class="paper-doll" viewBox="0 0 80 118" role="img" aria-label="Leather armor equipment status">
<path class="armor-slot" data-armor="Helm" d="M28 7 Q40 -1 52 7 L55 24 L48 27 L48 18 L32 18 L32 27 L25 24 Z"><title>Helm: not equipped</title></path>
<path class="armor-slot" data-armor="Breastplate" d="M29 30 L51 30 L60 37 L54 67 L26 67 L20 37 Z"><title>Breastplate: not equipped</title></path>
<path class="armor-slot" data-armor="Gauntlets" d="M16 39 L24 39 L25 67 L17 75 L11 66 Z M56 39 L64 39 L69 66 L63 75 L55 67 Z"><title>Gauntlets: not equipped</title></path>
<path class="armor-slot" data-armor="Greaves" d="M28 70 L39 70 L38 95 L27 95 Z M41 70 L52 70 L53 95 L42 95 Z"><title>Greaves: not equipped</title></path>
<path class="armor-slot" data-armor="Boots" d="M27 97 L38 97 L38 110 L22 110 L22 105 Z M42 97 L53 97 L58 105 L58 110 L42 110 Z"><title>Boots: not equipped</title></path>
</svg></div></div>
<div class="controls"><strong>Controls</strong>Move: WASD / Arrow Keys · Sword: Right Mouse Button</div>
<div id="popup-layer" class="popup-layer" hidden><div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title"><button id="popup-close" type="button" class="close" aria-label="Close">×</button><h2 id="popup-title"></h2><div id="popup-copy" aria-live="polite"></div><div class="actions" id="popup-actions"></div></div></div>
<div id="debug-nav"><button id="debug-toggle" type="button" aria-expanded="false" aria-controls="debug-menu">Debug</button><div id="debug-menu" hidden><label for="debug-panel">Teleport to panel</label><select id="debug-panel" aria-label="Jump to panel"></select><button id="debug-go" type="button">GO</button><div id="build-commit" aria-label="Latest GitHub commit">Commit: checking…</div></div></div><div id="treehouse-scene"><div class="treehouse-room" role="group" aria-label="Treehouse interior"><img class="treehouse-art" src="./art/team4_treehouse_interior.webp" alt="" decoding="async"><div class="room-window"></div><div class="room-bed"></div><div class="room-table"></div><div class="room-rug"></div><canvas id="room-hero" class="room-hero" width="100" height="130" aria-label="Boy"></canvas><button id="treehouse-door" class="room-door" aria-label="Exit treehouse"></button></div></div></main><script>
const debugToggle=document.getElementById('debug-toggle');
const debugMenu=document.getElementById('debug-menu');
debugToggle.addEventListener('click',()=>{
 const open=debugMenu.hidden;
 debugMenu.hidden=!open;
 debugToggle.setAttribute('aria-expanded',String(open));
});
document.addEventListener('pointerdown',event=>{
 if(!document.getElementById('debug-nav').contains(event.target)){
  debugMenu.hidden=true;
  debugToggle.setAttribute('aria-expanded','false');
 }
});
// Display the latest main-branch commit inside the debug menu. The label reflects
// GitHub's revision; GitHub Pages publication can lag behind the commit.
(async()=>{
 const label=document.getElementById('build-commit');
 label.textContent='Commit: bc24ecf (last known)';
 try{
  const response=await fetch('https://api.github.com/repos/clarkwyatt/prototypes/commits?per_page=1',{cache:'no-store'});
  if(!response.ok)throw new Error('GitHub revision unavailable');
  const commits=await response.json();
  label.textContent=commits[0]?.sha?'Commit: '+commits[0].sha.slice(0,7):'Commit: unavailable';
 }catch(_){/* Retain last-known revision when GitHub API is unavailable. */}
})();
// Load fresh game logic inside the Google Sites iframe without changing its embed URL.
const gameScript=document.createElement('script');
document.querySelector('.treehouse-art').src='./art/team4_treehouse_interior.webp?v='+Date.now();
gameScript.src='./game.js?v='+Date.now();
document.body.appendChild(gameScript);
</script></body></html>
