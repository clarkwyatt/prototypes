<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha OC Team 4 — First Playable</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35;color:#263d36;font-family:Nunito,system-ui,sans-serif;user-select:none}
body{display:grid;place-items:center;padding:14px}
#game{position:relative;width:min(1120px,calc(100vw - 28px));height:min(720px,calc(100dvh - 28px));border:5px solid #ead9ae;border-radius:22px;overflow:hidden;background:#9ecb87;box-shadow:0 22px 70px #081e197a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;pointer-events:none;align-items:start}
.quest,.inventory,.compass,.controls{border:2px solid #e7d7ad;background:linear-gradient(145deg,#fffdf4f5,#f8efd9ed);box-shadow:0 5px 0 #28473724,0 10px 24px #1a352d35;border-radius:16px;color:#31483c;font-weight:800}
.quest{min-width:185px;max-width:290px;padding:9px 13px;font-size:12px}.quest strong,.controls strong{display:block;color:#28704f;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.inventory{grid-column:2;justify-self:center;text-align:center;min-width:160px;padding:8px 13px;font-size:12px}.inventory span{display:block;color:#83662d;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.compass{grid-column:3;justify-self:end;width:70px;height:70px;border-radius:50%;position:relative;font-size:10px}.compass b{position:absolute}.n{top:4px;left:50%;transform:translateX(-50%);color:#28704f}.s{bottom:4px;left:50%;transform:translateX(-50%)}.e{right:6px;top:50%;transform:translateY(-50%)}.w{left:6px;top:50%;transform:translateY(-50%)}.compass i{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#3d9b68 50%,#d5c28f 50%)}
.controls{position:absolute;bottom:14px;left:14px;padding:8px 12px;font-size:11px;pointer-events:none}
.popup-layer{position:absolute;inset:0;z-index:5;display:none}.popup-layer.open{display:block}
.popup{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(310px,92%);max-height:48%;overflow:auto;padding:17px 18px;border:3px solid #e4cb91;border-radius:18px;background:radial-gradient(ellipse at 50% 0,#fffef7,#fff9eb 50%,#f1e2bf);box-shadow:0 10px 32px #051a1966}
.popup h2{font-size:19px;color:#285c4b;margin:0 28px 6px 0}.popup p{font-size:13px;font-weight:700;line-height:1.4}.close{position:absolute;right:9px;top:8px;border:0;border-radius:50%;width:28px;height:28px;background:#e6d4a7;color:#485b4c;font-size:18px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:8px 13px;font-weight:900;background:linear-gradient(#f0dfb7,#e6d4a7);color:#485b4c;cursor:pointer}.actions button.primary{background:linear-gradient(#55ae79,#34865d);color:white}
@media(max-width:700px){body{padding:0}#game{width:100vw;height:100dvh;border:0;border-radius:0}.hud{inset:8px 8px auto;gap:5px}.quest{min-width:0;width:min(42vw,230px);padding:7px 9px;font-size:10px}.inventory{min-width:90px;padding:6px 8px;font-size:10px}.compass{width:54px;height:54px;font-size:8px}.compass i{width:15px;height:15px}.controls{left:8px;bottom:8px;padding:6px 8px;font-size:9px}}
</style></head><body><main id="game">
<canvas id="world" aria-label="Team 4 top-down game"></canvas>
<div class="hud"><div class="quest"><strong>Quest</strong><span id="quest-text"></span></div><div class="inventory"><span>Inventory</span><b id="items">Empty</b></div><div class="compass" role="img" aria-label="Compass"><b class="n">N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b><i></i></div></div>
<div class="controls"><strong>Controls</strong>Move: WASD / Arrow Keys</div>
<div id="popup-layer" class="popup-layer"><div class="popup" role="dialog" aria-modal="true"><button id="popup-close" class="close" aria-label="Close">×</button><h2 id="popup-title"></h2><div id="popup-copy"></div><div class="actions" id="popup-actions"></div></div></div>
</main><script>const gameScript=document.createElement('script');gameScript.src='game.js?v='+Date.now().toString(36);document.body.appendChild(gameScript);</script></body></html>
