<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha OC — Team 1 First Playable</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35;color:#263d36;font-family:Nunito,system-ui,sans-serif;user-select:none}
body{display:grid;place-items:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:16px 18px auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}
.quest,.inventory,.compass,.controls-help{border:2px solid #e7d7ad;background:linear-gradient(145deg,#fffdf4f5,#f8efd9ed);box-shadow:0 5px 0 #28473724,0 10px 24px #1a352d35;backdrop-filter:blur(8px)}
.quest{border-radius:16px;padding:10px 15px;min-width:215px;max-width:290px;font-size:13px;font-weight:800;line-height:1.35}
.quest strong{color:#28704f}
.inventory{grid-column:2;grid-row:1;justify-self:center;border-radius:16px;padding:10px 17px;min-width:160px;text-align:center;font-size:13px;font-weight:800}
.inventory span{display:block;color:#83662d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.compass{grid-column:3;grid-row:1;justify-self:end;position:relative;width:74px;height:74px;border-radius:50%;font-size:11px;font-weight:900;color:#47634f}
.compass b{position:absolute}
.compass .n{top:4px;left:50%;transform:translateX(-50%);color:#28704f}
.compass .e{right:6px;top:50%;transform:translateY(-50%)}
.compass .s{bottom:4px;left:50%;transform:translateX(-50%)}
.compass .w{left:6px;top:50%;transform:translateY(-50%)}
.compass i{position:absolute;left:50%;top:50%;width:21px;height:21px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#3d9b68 0 50%,#d5c28f 50%)}
.controls-help{position:absolute;left:18px;bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;max-width:330px;padding:9px 13px;border-radius:13px;color:#31483c;font-size:12px;font-weight:800;line-height:1.3;pointer-events:none}
.controls-help strong{color:#28704f;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
@media(max-width:700px){
.hud{inset:8px 8px auto;gap:5px}
.quest{min-width:0;width:min(42vw,230px);padding:7px 9px;font-size:10px}
.inventory{min-width:90px;padding:7px 8px;font-size:10px}
.inventory span{font-size:9px}
.compass{width:54px;height:54px;font-size:8px}
.compass .n{top:2px}.compass .e{right:4px}.compass .s{bottom:2px}.compass .w{left:4px}.compass i{width:15px;height:15px}
.controls-help{left:8px;bottom:8px;max-width:260px;padding:6px 8px;font-size:10px}
.controls-help strong{font-size:10px}
}
</style>
</head>
<body>
<main id="game">
<canvas id="world" aria-label="Team 1 top-down adventure"></canvas>
<div class="hud">
<div class="quest" id="quest"><strong>• Explore the Village</strong></div>
<div class="inventory"><span>Inventory</span><b id="items">Empty</b></div>
<div class="compass" role="img" aria-label="Compass, north is up"><b class="n">N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b><i></i></div>
</div>
<div class="controls-help" aria-label="Game controls"><strong>Controls</strong><span>Move: WASD / Arrow Keys</span></div>
</main>
<script>
const gameScript=document.createElement("script");
gameScript.src=`game.js?v=${Date.now().toString(36)}`;
document.body.appendChild(gameScript);
</script>
</body>
</html>
