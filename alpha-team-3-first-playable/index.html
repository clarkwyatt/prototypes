<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alpha Workshop — First Playable Starter</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #808080; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="A hero standing in the center of an empty gray screen"></canvas>
  <script>
    // Request the latest game code whenever this page opens.
    const gameScript = document.createElement("script");
    gameScript.src = `game.js?v=${Date.now().toString(36)}`;
    document.body.appendChild(gameScript);
  </script>
</body>
</html>
