<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha OC Team 3 — First Playable</title>
<style>
:root{--cream:#fff9eb;--gold:#e7d7ad;--green:#28704f;--ink:#31483c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#76ae59;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;pointer-events:none}
.quest,.inventory,.compass,.controls{border:2px solid var(--gold);background:linear-gradient(145deg,#fffdf4f5,#f8efd9ed);box-shadow:0 5px 0 #28473724,0 10px 24px #1a352d35;border-radius:16px;padding:9px 13px;font-size:12px;font-weight:800}
.quest{justify-self:start;min-width:165px;max-width:290px}.quest strong,.inventory span{display:block;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.inventory{grid-column:2;justify-self:center;min-width:150px;text-align:center}.inventory span{font-size:10px}.inventory b{display:block;margin-top:3px}
.compass{grid-column:3;justify-self:end;position:relative;width:70px;height:70px;padding:0;border-radius:50%;font-size:10px;text-align:center}
.compass b{position:absolute}.compass .n{top:4px;left:50%;transform:translateX(-50%);color:var(--green)}.compass .e{right:6px;top:50%;transform:translateY(-50%)}.compass .s{bottom:4px;left:50%;transform:translateX(-50%)}.compass .w{left:6px;top:50%;transform:translateY(-50%)}
.compass i{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#3d9b68 0 50%,#d5c28f 50%)}
.debug{position:absolute;right:14px;bottom:14px;z-index:4;font-size:12px;font-weight:800;color:var(--ink)}
.debug-toggle,.debug-go{border:2px solid var(--gold);background:var(--cream);color:var(--green);border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}
.debug-panel{position:absolute;bottom:42px;right:0;width:215px;padding:12px;border:2px solid var(--gold);border-radius:13px;background:var(--cream);box-shadow:0 8px 24px #18352566}
.debug-panel[hidden]{display:none}.debug-panel label{display:block;margin-bottom:6px}.debug-panel select{width:100%;padding:7px;margin-bottom:9px;border:1px solid #bca979;border-radius:8px;background:white}
.debug-panel .debug-go{width:100%;background:#3d9b68;color:white}.debug-commit{display:block;margin-top:9px;font-size:11px;overflow-wrap:anywhere}
.controls{position:absolute;left:14px;bottom:14px;font-size:11px;border-radius:12px;pointer-events:none}.controls strong{color:var(--green);text-transform:uppercase;margin-right:9px}
.touch{position:absolute;right:14px;bottom:14px;display:none;grid-template-columns:44px 44px 44px;grid-template-rows:42px 42px;gap:4px}
.touch button{border:2px solid var(--gold);background:var(--cream);color:var(--green);border-radius:12px;font-size:18px;font-weight:900;touch-action:none}
.touch [data-dir=up]{grid-column:2}.touch [data-dir=left]{grid-column:1}.touch [data-dir=down]{grid-column:2}.touch [data-dir=right]{grid-column:3}
.modal{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.modal.open{display:flex}.card{position:relative;width:min(330px,92vw);max-height:55vh;overflow:auto;border:3px solid #e4cb91;border-radius:18px;background:linear-gradient(#fffef7,#f8efd9);box-shadow:0 10px 32px #051a1966;padding:17px 18px 16px}
.card h2{font-size:19px;margin:0 28px 8px 0;color:#285c4b}.card p{font-size:13px;line-height:1.4}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.buttons button{border:0;border-radius:11px;padding:8px 13px;background:#3d9b68;color:white;font-weight:800;cursor:pointer}.buttons button.secondary{background:#e6d4a7;color:#485b4c}
#modal-close{position:absolute;right:10px;top:8px;width:28px;height:28px;border:0;border-radius:50%;background:#e6d4a7;color:#485b4c;font-size:18px;font-weight:900;cursor:pointer}
@media(pointer:coarse){.touch{display:grid}}
@media(max-width:600px){.hud{inset:8px 8px auto;gap:5px}.quest{min-width:0;max-width:40vw;padding:7px 8px;font-size:10px}.inventory{min-width:90px;padding:7px;font-size:10px}.compass{width:55px;height:55px;font-size:9px}.compass i{width:15px;height:15px}.controls{left:8px;bottom:8px;padding:7px 8px;font-size:9px;max-width:48vw}.controls strong{display:block}}
</style>
</head>
<body>
<main id="game">
<canvas id="world" aria-label="Top-down grassy game field with a placeholder character"></canvas>
<div class="hud"><div class="quest"><strong>Quest</strong><span id="quest-text"></span></div><div class="inventory"><span>Inventory</span><b id="items">Empty</b></div><div class="compass" role="img" aria-label="Compass, north is up"><b class="n">N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b><i></i></div></div>
<div class="debug"><button id="debug-toggle" class="debug-toggle" type="button" aria-expanded="false">DEBUG</button><div id="debug-panel" class="debug-panel" hidden><label for="debug-select">Panel</label><select id="debug-select"></select><button id="debug-go" class="debug-go" type="button">GO</button><span id="debug-commit" class="debug-commit">Commit: Checking…</span></div></div>
<div class="controls"><strong>Controls</strong><span>Move: WASD / Arrow Keys</span></div>
<div class="touch" aria-label="Movement controls"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div>
<section class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Interaction"><div class="card"><button id="modal-close" type="button" aria-label="Close">×</button><h2 id="modal-title"></h2><div id="modal-copy"></div><div class="buttons" id="modal-buttons"></div></div></section>
</main>
<script>
const script=document.createElement("script");
script.src=`game.js?v=${Date.now().toString(36)}`;
document.body.appendChild(script);
</script>
</body>
</html>
